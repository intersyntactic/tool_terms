include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

# The analyzer plugin system reads this only at the top level, beside
# `analyzer:` and `linter:`; nested under `analyzer:` the rules never run.
plugins:
  is_lint_rules:
    version: ^0.1.3
    diagnostics:
      no_dynamic: true
      no_cast_from_untyped: true
      no_default_on_closed_type: true
      no_ignore_comment: true
      no_json_object_check: true
      no_string_literal_compare: true
      no_visible_for_testing: true

linter:
  rules:
    - avoid_dynamic_calls
    - only_throw_errors
    - avoid_catching_errors
    - avoid_catches_without_on_clauses
